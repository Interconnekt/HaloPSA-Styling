<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Time Breakdown</title>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet" type="text/css">
    <style type="text/css">
        @font-face {
            font-family: 'Figtree';
            font-weight: 400;
            src: url('https://fonts.gstatic.com/s/figtree/v9/_Xmz-HUzqDCFdgfMsYiV_F7wfS-Bs_d_QG5ZyEA.woff2') format('woff2');
        }
        @font-face {
            font-family: 'Figtree';
            font-weight: 600;
            src: url('https://fonts.gstatic.com/s/figtree/v9/_Xmz-HUzqDCFdgfMsYiV_F7wfS-Bs_ehR25ZyEA.woff2') format('woff2');
        }
        @font-face {
            font-family: 'Figtree';
            font-weight: 700;
            src: url('https://fonts.gstatic.com/s/figtree/v9/_Xmz-HUzqDCFdgfMsYiV_F7wfS-Bs_eYR25ZyEA.woff2') format('woff2');
        }
        @font-face {
            font-family: 'Figtree';
            font-weight: 800;
            src: url('https://fonts.gstatic.com/s/figtree/v9/_Xmz-HUzqDCFdgfMsYiV_F7wfS-Bs_f_R25ZyEA25WTzZO8.woff2') format('woff2');
        }
        @font-face {
            font-family: 'Bricolage Grotesque';
            font-weight: 400;
            src: url('https://fonts.gstatic.com/s/bricolagegrotesque/v9/3y9U6as8bTXq_nANBjzKo3IeZx8z6up5BeSl5jBNz_19PpbpMXuECpwUxJBOm_OJWiaaD30YfKfjZZoLvRvi-Molsg.woff2') format('woff2');
        }
        @font-face {
            font-family: 'Bricolage Grotesque';
            font-weight: 600;
            src: url('https://fonts.gstatic.com/s/bricolagegrotesque/v9/3y9U6as8bTXq_nANBjzKo3IeZx8z6up5BeSl5jBNz_19PpbpMXuECpwUxJBOm_OJWiaaD30YfKfjZZoLvcXl-Molsg.woff2') format('woff2');
        }
        @font-face {
            font-family: 'Bricolage Grotesque';
            font-weight: 700;
            src: url('https://fonts.gstatic.com/s/bricolagegrotesque/v9/3y9U6as8bTXq_nANBjzKo3IeZx8z6up5BeSl5jBNz_19PpbpMXuECpwUxJBOm_OJWiaaD30YfKfjZZoLvfzl-Molsg.woff2') format('woff2');
        }
        @font-face {
            font-family: 'Bricolage Grotesque';
            font-weight: 800;
            src: url('https://fonts.gstatic.com/s/bricolagegrotesque/v9/3y9H6as8bTXq_nANBjzKo3IeZx8z6up5BeSl9D4dj_x9PpZBMnuECoAsyJBOm_OJ2iCwA1XphjhQYg.woff2') format('woff2');
        }

        @page {
            size: A4;
            margin: 22mm 12.7mm 30mm 12.7mm;
        }

        *, *::before, *::after {
            font-family: Figtree, Arial, sans-serif !important;
            box-sizing: border-box;
        }

        body {
            font-family: Figtree, Arial, sans-serif !important;
            font-size: 12px;
            line-height: 1.6;
            color: #33384a;
            margin: 0;
            padding: 0;
        }

        /* ── Section header ── */
        .section-header {
            font-family: 'Bricolage Grotesque', Figtree, Arial, sans-serif !important;
            font-size: 14px;
            font-weight: 700;
            color: #141824;
            margin: 20px 0 12px 0;
            padding: 8px 14px;
            background-color: #E4EAFC;
            border-radius: 6px;
        }

        .section-intro {
            font-size: 12px;
            color: #33384a;
            margin-bottom: 16px;
            line-height: 1.6;
        }

        /* ── Report table (finance styling) ── */
        .report-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            margin: 0;
            border-top: 1px solid #E4E7F0;
            border-bottom: 1px solid #E4E7F0;
        }

        .report-table thead {
            display: table-header-group;
        }

        .report-table thead th {
            background-color: #E7EEFA;
            color: #141824;
            font-weight: 700;
            text-align: left;
            padding: 12px;
            font-size: 11px;
            white-space: nowrap;
        }

        .report-table tbody td {
            padding: 8px 12px;
            border-bottom: 1px solid #E4E7F0;
            vertical-align: top;
            color: #33384a;
            font-size: 11px;
            word-wrap: break-word;
        }

        /* ── Column widths: squeeze 2-5, maximise Action ── */
        .report-table thead th:nth-child(2),
        .report-table tbody td:nth-child(2) { width: 90px; }   /* Agent */

        .report-table thead th:nth-child(3),
        .report-table tbody td:nth-child(3) { width: 78px; }   /* Date */

        .report-table thead th:nth-child(4),
        .report-table tbody td:nth-child(4) { width: 105px; }  /* Time Recorded */

        .report-table thead th:nth-child(5),
        .report-table tbody td:nth-child(5) { width: 78px; }   /* Time Billed */

        .report-table tbody tr {
            page-break-inside: avoid;
        }

        .report-table tbody tr:nth-child(even) {
            background-color: #F7F9FD;
        }
    </style>
</head>
<body>

    <div class="section-header">Time Breakdown</div>

    <div class="section-intro">
        Please see below breakdown of the individual time entries that have been included in this invoice. If more detail is required please let us know.
    </div>

    <table class="report-table">
        $REPORT273DATA
    </table>

</body>
</html>
